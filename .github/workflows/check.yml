---
# Checks every pull request and every push to main: what the pre-commit hook
# runs locally, plus the end to end test, which needs a Fedora container.
name: check

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Every tool comes from mise.toml, at the version a developer runs.
      - uses: jdx/mise-action@v5.3.0
        with:
          cache: false
      - name: Lint
        run: hk check --all
      - name: Unit tests
        run: python3 -m unittest discover -s tools -v

  # The whole publishing job against a local stand-in for the bucket, with
  # a throwaway key, and dnf installing from it.
  e2e:
    runs-on: ubuntu-26.04
    container: docker.io/library/fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: End to end
        run: bash test/e2e.sh
